name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ecommerce_test
          MYSQL_USER: inventory
          MYSQL_PASSWORD: inventory_pass
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_NAME: ecommerce_test
      DB_USER: inventory
      DB_PASSWORD: inventory_pass
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript syntax
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -print | while read -r file; do node --check "$file" || exit 1; done
      - name: Run unit tests
        run: npm test
      - name: Run MySQL integration tests
        env:
          RUN_DB_TESTS: '1'
        run: npm test
