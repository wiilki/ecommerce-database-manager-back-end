name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript syntax
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -print | while read -r file; do node --check "$file" || exit 1; done
      - name: Run validation tests
        run: npm test
